version: '3.8'

services:
  # --- 1. Streamlit + LangGraph Application ---
  web-app:
    build: .
    container_name: craftgpt_app
    ports:
      - "8501:8501"
    environment:
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=CraftGPT-Evaluation
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
    volumes:
      - ./docs:/app/docs
      - ./vector_db:/app/vector_db
      - ./chat_logs.json:/app/chat_logs.json
    depends_on:
      - qdrant
    restart: unless-stopped

  # --- 2. Production Vector Database (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: craftgpt_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data: